<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Understanding the Uncollected</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .rd-dashboard {
      color: #222;
      max-width: 100%;
    }

    .rd-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .rd-table-container {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 1rem;
      border: 1px solid #ccc;
    }

    .rd-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .rd-table th,
    .rd-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
    }

    .rd-table th {
      background: #f5f5f5;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .rd-table tr:hover {
      background: #f0f7ff;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 1px 4px;
      font-size: 0.75rem;
      border-radius: 3px;
      background: #eee;
      color: #333;
    }

    .badge.warn {
      background: #fff3cd;
      color: #856404;
    }

    dialog {
      width: min(650px, 90vw);
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.4);
    }

    .dlg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
    }

    .dlg-close {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>

<body>
  <a class="return-link" href="./index.html">Return to Home</a>
  <h1>Understanding the Uncollected</h1>
  <p>Written by Alysa Meng and Maryelizabeth Koepele</p>



  <div class="rd-dashboard">
    <h2>This chart shows readings containing at least one uncollected or unpublished work.</h2>

    <div class="chart" id="chart-container"></div>

    <h3 id="reading-header">Select a reading from above or click below:</h3>
    <div class="rd-table-container">
      <table class="rd-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Reading Title</th>
            <th>Tracks</th>
          </tr>
        </thead>
        <tbody><!-- Data rows will get injected here via JS later --></tbody>
      </table>
    </div>

    <!-- Modal Dialog UI -->
    <dialog id="track-dialog">
      <div class="dlg-header">
        <h3 id="dlg-title" style="margin:0;"></h3>
        <button class="dlg-close">✕</button>
      </div>
      <div id="dlg-body" style="margin-top:1rem;"></div>
    </dialog>
  </div>

  <script type="module" src="./uncollected_chart.js"></script>

  <br/>
</body>

</html>
